<header class="header">
  <div class="header-left">
    <h1 class="logo">
      <span class="logo-icon">{{icon}}</span>
      <span>{{title}}</span>
    </h1>
    <span class="header-subtitle">{{subtitle}}</span>
  </div>
  <div class="header-chain">
    <span class="chain-label">🔗 {{chain.name}}</span>
    <div class="chain-users">{{chain_users}}</div>
  </div>
  <div class="header-right">
    <span class="free-badge">{{badge}}</span>
  </div>
</header>
